<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <div class="card-header">
            <img src="./photo/Screenshot_2026-10-05_141844-removebg-preview.png">
            <div>
                <h1>Morgan Maxwell</h1>
                <h2>Music Specialist</h2>
            </div>
        </div>
        <div class="contacts">
            <div class="contact">
                <span>123-456-7890</span>
                <i class="fa-solid fa-phone"></i>
            </div>
             <div class="contact">
                <span>www.reallygreatsite.com</span>
                <i class="fa-solid fa-globe"></i>
            </div>
            <div class="contact">
                <span>hello@reallygreatsite.com</span>
                <i class="fa-solid fa-at"></i>
            </div>
            <div class="contact">
                <span>123 Anywhere St., Any City</span>
                <i class="fa-solid fa-location-dot"></i>
            </div>
        </div>
    </div>
</body>

</html>
